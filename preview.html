<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Younion Dashboard</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
  .active {
    background: #2563eb;
    color: white;
  }
</style>

<script>
  function showPage(page, el) {
    document.querySelectorAll(".page").forEach(p => p.classList.add("hidden"));
    document.getElementById(page).classList.remove("hidden");

    document.querySelectorAll(".nav-btn").forEach(btn => btn.classList.remove("active"));
    el.classList.add("active");
  }
</script>
</head>

<body class="bg-gray-50 font-sans">

<div class="flex h-screen">

  <!-- SIDEBAR -->
  <aside class="w-64 bg-white border-r p-6 flex flex-col justify-between">

    <div>
      <!-- LOGO -->
      <div class="mb-10 flex justify-center">
        <img src="logo-younion.png" class="w-36">
      </div>

      <!-- NAV -->
      <nav class="space-y-2 text-gray-600">
        <button onclick="showPage('home', this)" class="nav-btn active w-full text-left px-4 py-3 rounded-xl">🏠 Home</button>
        <button onclick="showPage('yearbook', this)" class="nav-btn w-full text-left px-4 py-3 rounded-xl hover:bg-gray-100">📘 Yearbook</button>
        <button onclick="showPage('jobs', this)" class="nav-btn w-full text-left px-4 py-3 rounded-xl hover:bg-gray-100">💼 Jobs</button>
        <button onclick="showPage('network', this)" class="nav-btn w-full text-left px-4 py-3 rounded-xl hover:bg-gray-100">🤝 Network</button>
        <button onclick="showPage('profile', this)" class="nav-btn w-full text-left px-4 py-3 rounded-xl hover:bg-gray-100">👤 Profile</button>
      </nav>
    </div>

    <p class="text-xs text-gray-400 text-center">© Younion 2026</p>
  </aside>

  <!-- MAIN -->
  <div class="flex-1 flex flex-col">

    <!-- TOPBAR -->
    <header class="bg-white border-b px-6 py-4 flex justify-between items-center">
      <input type="text" placeholder="Search alumni, jobs..."
        class="border rounded-xl px-4 py-2 w-1/3 focus:ring-2 focus:ring-blue-500"/>

      <div class="flex items-center gap-5">
        <span class="text-xl">🔔</span>
        <img src="https://i.pravatar.cc/40" class="rounded-full ring-2 ring-blue-500"/>
      </div>
    </header>

    <!-- CONTENT -->
    <main class="p-6 overflow-y-auto">

      <!-- ================= HOME ================= -->
      <div id="home" class="page grid grid-cols-3 gap-6">

        <div class="col-span-2 space-y-6">

          <div class="bg-white p-4 rounded-2xl shadow-sm">
            <input placeholder="Share something with alumni..."
              class="w-full border rounded-xl px-4 py-3 focus:ring-2 focus:ring-blue-500"/>
          </div>

          <div class="bg-white p-5 rounded-2xl shadow-sm">
            <div class="flex items-center gap-3 mb-3">
              <img src="https://i.pravatar.cc/50" class="rounded-full"/>
              <div>
                <h3 class="font-semibold">Alex Pratama</h3>
                <p class="text-xs text-gray-500">SMA • 2010 • ✅ Verified</p>
              </div>
            </div>

            <p class="mb-3">Reuni akbar tahun ini 🔥</p>

            <div class="flex justify-between text-sm text-gray-500">
              <span>❤️ 120</span>
              <span>💬 30</span>
            </div>
          </div>

        </div>

        <div class="space-y-6">

          <div class="bg-white p-4 rounded-2xl shadow-sm">
            <h3 class="font-semibold mb-2">Yearbook</h3>
            <div class="grid grid-cols-3 gap-2">
              <img src="https://i.pravatar.cc/60?1" class="rounded"/>
              <img src="https://i.pravatar.cc/60?2" class="rounded"/>
              <img src="https://i.pravatar.cc/60?3" class="rounded"/>
            </div>
          </div>

          <div class="bg-white p-4 rounded-2xl shadow-sm">
            <h3 class="font-semibold mb-2">Jobs</h3>
            <p class="text-sm">Frontend Dev • Rp10jt</p>
          </div>

        </div>

      </div>

      <!-- ================= YEARBOOK ================= -->
      <div id="yearbook" class="page hidden">
        <h2 class="text-xl font-bold mb-6">Yearbook</h2>

        <div class="grid grid-cols-5 gap-4">
          <div class="bg-white p-4 rounded-2xl shadow-sm text-center">
            <img src="https://i.pravatar.cc/100" class="rounded-full mx-auto mb-2"/>
            <h3 class="font-semibold">Rina</h3>
            <button class="mt-2 bg-blue-600 text-white px-3 py-1 rounded-xl text-sm">Connect</button>
          </div>
        </div>
      </div>

      <!-- ================= JOBS ================= -->
      <div id="jobs" class="page hidden">
        <h2 class="text-xl font-bold mb-6">Jobs</h2>

        <div class="grid grid-cols-2 gap-4">
          <div class="bg-white p-5 rounded-2xl shadow-sm">
            <h3 class="font-semibold">Frontend Developer</h3>
            <p class="text-sm text-gray-500">Rp10-15jt • Alumni Only</p>
            <button class="mt-3 bg-blue-600 text-white px-4 py-2 rounded-xl">Apply</button>
          </div>
        </div>
      </div>

      <!-- ================= NETWORK ================= -->
      <div id="network" class="page hidden">
        <h2 class="text-xl font-bold mb-6">Network</h2>

        <div class="grid grid-cols-2 gap-4">
          <div class="bg-white p-4 rounded-2xl shadow-sm flex justify-between items-center">
            <div class="flex items-center gap-3">
              <img src="https://i.pravatar.cc/60" class="rounded-full"/>
              <span>Budi Santoso</span>
            </div>
            <button class="bg-blue-600 text-white px-3 py-1 rounded-xl">Connect</button>
          </div>
        </div>
      </div>

      <!-- ================= PROFILE ================= -->
      <div id="profile" class="page hidden">
        <h2 class="text-xl font-bold mb-6">Profile</h2>

        <div class="bg-white p-6 rounded-2xl shadow-sm">
          <img src="https://i.pravatar.cc/100" class="rounded-full mb-3"/>
          <h3 class="text-lg font-bold">Yudha Nugraha</h3>
          <p class="text-gray-500">Fullstack Developer</p>

          <button class="mt-4 bg-blue-600 text-white px-4 py-2 rounded-xl">
            Edit Profile
          </button>
        </div>
      </div>

    </main>

  </div>

</div>

<script>
  showPage('home', document.querySelector('.nav-btn'))
</script>

</body>
</html>
